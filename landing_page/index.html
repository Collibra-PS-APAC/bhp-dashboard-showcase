<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>BHP Data Catalog</title>

    <!-- Shared assets live at the bundle root; this page sits one level down in
         landing_page/, so it reaches them with a single ../ hop. styles.css
         carries the hero, search, and scope pills; landing-hub.css owns the
         category cards and the bento. -->
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/brand-tokens.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/landing-hub.css">
    <!-- Slide transition shared with the gateway: animates arrival from, and
         return to, the showcase root. Progressive enhancement only. -->
    <link rel="stylesheet" href="../brand/transitions.css">
    <script src="../brand/transitions.js"></script>
</head>
<body>
    <!--
        The landing hub. The hero and search reuse the .wrap / .top / .hero /
        .search / .scope components from styles.css verbatim, so the front door
        matches the rest of the catalog. hub.js renders the four category cards
        into #hubGrid and builds a category's bento into #hubDetail on demand.
    -->
    <main class="wrap" id="landing">
        <div class="top">
            <div class="hero">
                <p class="eyebrow">BHP Data Catalog</p>
                <!-- Neutral fallback name until hub.js resolves the signed-in user. -->
                <h1 class="hero__greeting">
                    <span class="l1">Hi <span id="userFirstName">there</span>.</span><br>
                    <span class="muted l2">Where would you like to start?</span>
                </h1>
                <div class="rule"></div>
                <p class="lede">Four ways into BHP's governed data, standards, and learning.</p>
            </div>
            <div class="hero-search">
                <form class="search" id="catalogSearch" role="search" autocomplete="off">
                    <!-- Inline search icon (Lucide "search"), self-contained so no CDN or CSP allowance is needed. -->
                    <svg class="search__icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search the data catalog"
                        aria-label="Search the data catalog">
                    <button type="submit">Search</button>
                </form>
                <div class="scope" id="searchScope" role="group" aria-label="Limit search to an asset type">
                    <span class="on" role="button" tabindex="0" data-scope="all">All assets</span>
                    <span role="button" tabindex="0" data-scope="dataUtility">Data Utilities</span>
                    <span role="button" tabindex="0" data-scope="dataConcept">Business Data Concepts</span>
                    <span role="button" tabindex="0" data-scope="businessApplication">Business Applications</span>
                    <span role="button" tabindex="0" data-scope="businessTerm">Business Terms</span>
                </div>
            </div>
        </div>

        <!--
            The hub stage. Two views share it: #hubGrid (the four cards) and
            #hubDetail (one opened category). hub.js shows one at a time and runs
            the exit/enter choreography between them.
        -->
        <section class="hub" id="hub" aria-label="Explore the data catalog">
            <div class="hub__stage">
                <div class="hub__grid" id="hubGrid"></div>
                <div class="hub__detail" id="hubDetail" hidden></div>
            </div>
        </section>
    </main>

    <!--
        Script order:
        1. ../shared/utils.js - COLLIBRA_BASE, getCurrentUser (for the greeting)
        2. hub.js             - greeting, search, and the card -> bento choreography
    -->
    <script src="../shared/utils.js"></script>
    <script src="hub.js"></script>

    <!-- DEMO ONLY: canned data for the public showcase. The hub needs only the
         current user (for the greeting); search is stubbed to a no-op since there
         is no Collibra instance behind this static page. -->
    <script>
    (function () {
      getCurrentUser = function () {
        return Promise.resolve({ id: 'demo-user', firstName: 'Shane', lastName: 'Dolley', userName: 'shane.dolley' });
      };
      runSearch = function (event) { event.preventDefault(); };
    })();
    </script>
</body>
</html>
